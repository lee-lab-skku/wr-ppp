name: Test and release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  validate:
    name: Validate checkout
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.release.outputs.commit || steps.development.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - id: release
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python .github/scripts/release.py prepare
          --tag "$RELEASE_TAG" --expected-commit "$GITHUB_SHA"
          --github-output "$GITHUB_OUTPUT"
      - id: development
        if: github.event_name == 'workflow_dispatch'
        name: Resolve selected checkout
        run: |
          commit=$(git rev-parse HEAD)
          test "$commit" = "$GITHUB_SHA"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  posix:
    name: Test (${{ matrix.os }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Use the operating system's Bash
        shell: /bin/bash -e {0}
        run: |
          mkdir -p "$RUNNER_TEMP/wr-shell"
          ln -s /bin/bash "$RUNNER_TEMP/wr-shell/bash"
          echo "$RUNNER_TEMP/wr-shell" >> "$GITHUB_PATH"
      - name: Run POSIX and common regression tests
        run: python -B -m unittest discover -s tests -v

  windows:
    name: Build and test Windows installer
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    env:
      WR_CONFIG: ${{ github.workspace }}/.runtime/ci-config.json
      # Bump to refresh upstream TeX packages without changing the installer script.
      TINYTEX_CACHE_REVISION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          architecture: x64
      - name: Set up Python environment
        run: .\Windows-Setup.ps1 -Python (Join-Path $env:pythonLocation 'python.exe')
      - name: Run native, PowerShell and common tests
        run: .\windows\test.ps1 -Gui
      - name: Check browser preservation and save ordering
        env:
          WR_REQUIRE_BROWSER: '1'
        run: |
          . .\windows\common.ps1
          $node = (Get-Command node -CommandType Application -TotalCount 1).Source
          Invoke-WrChecked $node @('tests/test_inline_render.js')
          Invoke-WrChecked $node @('tests/test_editor_saves.js')
          Invoke-WrChecked (Resolve-WrPython) @('tests/check_editor_geometry.py')
          Invoke-WrChecked (Resolve-WrPython) @('tests/check_editor_browser.py')
          Invoke-WrChecked (Resolve-WrPython) @('tests/check_preservation_browser.py')
      - name: Restore prepared TinyTeX
        id: tinytex-cache
        uses: actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .runtime/TinyTeX
          key: tinytex-windows-2025-${{ runner.arch }}-${{ env.TINYTEX_CACHE_REVISION }}-${{ hashFiles('windows/install-tex.ps1', 'windows/common.ps1', 'windows/distribution_licenses.py') }}
      - name: Prepare bundled TinyTeX
        if: steps.tinytex-cache.outputs.cache-hit != 'true'
        run: .\windows\install-tex.ps1 -PrepareDistribution
      - name: Test actual native TeX and administrator builds
        run: |
          . .\windows\common.ps1
          Invoke-WrChecked (Resolve-WrPython) @('windows/weekly_report.py', 'setup', '--tex-bin', (Join-Path $PWD '.runtime/TinyTeX/bin/windows'))
          Invoke-WrChecked (Resolve-WrPython) @('windows/tests/real_build.py')
      # Save only after real TeX validation, before unrelated packaging can fail.
      - name: Cache validated TinyTeX
        if: steps.tinytex-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .runtime/TinyTeX
          key: ${{ steps.tinytex-cache.outputs.cache-primary-key }}
      - name: Prepare pinned Inno Setup
        run: .\.github\scripts\prepare-inno.ps1
      - name: Package, sanitize and build installer
        run: |
          .\windows\build-installer.ps1 -Compiler (Join-Path $PWD '.windows-deps/inno/ISCC.exe')
          $version = (Get-Content -LiteralPath 'windows/dist/WeeklyReport/_internal/VERSION' -Raw).Trim()
          "INSTALLER_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test sanitized portable bundle without development tools
        run: .\windows\tests\portable_smoke.ps1
      - name: Test installed EXE and uninstallation
        run: >-
          .\windows\tests\installer_smoke.ps1
          -Installer (Join-Path $PWD "windows/dist/installer/WeeklyReport-$env:INSTALLER_VERSION-Setup.exe")
          -ExpectedVersion $env:INSTALLER_VERSION
      - name: Verify installer checksum and exact asset set
        run: |
          . .\windows\common.ps1
          Invoke-WrChecked (Resolve-WrPython) @('.github/scripts/release.py', 'verify-artifacts', '--version', $env:INSTALLER_VERSION, '--directory', 'windows/dist/installer')
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            windows/dist/installer/*.exe
            windows/dist/installer/*.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Preserve installer diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer-diagnostics
          path: |
            .runtime/qa/installer.log
            .runtime/qa/uninstaller.log
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [validate, posix, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: .runtime/release-assets
      - name: Publish verified assets and changelog notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: >-
          python .github/scripts/release.py publish
          --tag "$RELEASE_TAG" --expected-commit "$RELEASE_COMMIT"
          --directory .runtime/release-assets --repository "$GITHUB_REPOSITORY"
